name = "myriad"
main = "src/index.ts"
compatibility_date = "2026-09-12"
workers_dev = true

[vars]
MYRIAD_ENV = "production"
AUTH_PUBLIC_ORIGIN = "https://myriad.ing"

[[routes]]
pattern = "myriad.ing"
custom_domain = true

[[routes]]
pattern = "www.myriad.ing"
custom_domain = true

[[kv_namespaces]]
binding = "MYRIAD_KEYS"
id = "d5045f56ebe34e509038ed8fccb7048c"

[[d1_databases]]
binding = "MYRIAD_LEDGER"
database_name = "myriad-ledger"
database_id = "a1782695-7a08-40da-8ea3-f296a71f2012"
migrations_dir = "migrations"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/health"]
