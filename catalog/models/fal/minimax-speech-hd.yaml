# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: minimax-speech-hd
vendor: fal
name: MiniMax Speech 2.8 HD
# 上游调用名，原样传给适配器
vendor_model: fal-ai/minimax/speech-2.8-hd

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: generate.audio
modality: audio
mode: sync
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: audio.speech
enabled: true

description: |
  MiniMax Speech 2.8 HD，经 fal 上架的高品质 TTS，与 Turbo 同代、音质更高。
  官方按每 1000 字符 $0.10 计价，无法直接落到 audio_second。

docs: https://fal.ai/models/fal-ai/minimax/speech-2.8-hd

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: minimax
  origin_model: speech-2.8-hd

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
pricing:
  unit: audio_second
  currency: CNY
  as_of: 2026-09-16
  source: official
  second:
    cny_per_unit: null
