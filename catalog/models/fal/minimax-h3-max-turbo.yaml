# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: minimax-h3-max-turbo
vendor: fal
name: MiniMax H3 Max Turbo
# 新系列没有 fal-ai/ 前缀，必须原样传给 fal.subscribe / queue.fal.run
vendor_model: minimax/h3-max-turbo/text-to-video

kind: generate.video
modality: video
mode: async
capability: video.generate
enabled: true

io:
  input: [text]
  output: [video]
abilities:
  playground: true

description: |
  fal 官方 H3 Max Turbo 文生视频。endpoint 为 minimax/h3-max-turbo/text-to-video。
  MiniMax H3 的 fal 后训练速度档，必填 prompt_expansion_mode（默认 balanced）。
  常规刊例 480p $0.025/秒、768p $0.04/秒、1080p $0.08/秒；
  2026-09-30 前有限时五折。走 queue.fal.run。

docs: https://fal.ai/models/minimax/h3-max-turbo/text-to-video

lineage:
  origin: minimax
  origin_model: h3-max-turbo

pricing:
  unit: video_second
  currency: CNY
  as_of: 2026-09-18
  source: estimate
  second:
    cny_per_unit: 0.27
