# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: minimax-hailuo-02-pro
vendor: fal
name: MiniMax Hailuo 02 Pro
# 上游调用名，原样传给适配器
vendor_model: fal-ai/minimax/hailuo-02/pro/text-to-video

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: generate.video
modality: video
mode: async
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: video.generate
enabled: true

io:
  input: [text]
  output: [video]
abilities:
  playground: true

description: |
  MiniMax Hailuo 02 Pro 文生视频，经 fal 上架的当前主推 1080p 型号，Video 01 后继。
  官方按秒计价 $0.08/秒（6 秒约 $0.48）。

docs: https://fal.ai/models/fal-ai/minimax/hailuo-02/pro/text-to-video

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: minimax
  origin_model: hailuo-02-pro

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
# 官方 $0.08/秒，按 6.72 折人民币。
pricing:
  unit: video_second
  currency: CNY
  as_of: 2026-09-16
  source: estimate
  second:
    cny_per_unit: 0.54
