# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: minimax-video
vendor: fal
name: MiniMax Video 01
# 上游调用名，原样传给适配器
vendor_model: fal-ai/minimax/video-01

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: generate.video
modality: video
mode: async
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: video.generate
enabled: false

description: |
  上一代 MiniMax Video 01。Hailuo-02 官方页标 Previous generation，已从默认目录拿掉。
  视频兜底改走 H3 Max Turbo。

docs: https://fal.ai/models/fal-ai/minimax/video-01

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: minimax
  origin_model: video-01

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
# 官方 $0.5/条、典型 6 秒；折 $0.0833/秒，再按 6.72 换人民币。
pricing:
  unit: video_second
  currency: CNY
  as_of: 2026-09-16
  source: estimate
  second:
    cny_per_unit: 0.56
