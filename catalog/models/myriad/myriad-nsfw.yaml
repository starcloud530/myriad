# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: myriad-nsfw
vendor: myriad
name: 图像敏感内容检测
# 上游调用名，原样传给适配器
vendor_model: myriad-nsfw

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: score.classify
modality: image
mode: sync
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: image-nsfw
enabled: true

description: |
  万象自建，第一期先走接线。图像敏感内容分类打分，随后替换为自有模型服务。

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: myriad
  origin_model: myriad-nsfw

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
pricing:
  unit: image
  currency: CNY
  as_of: 2026-09-16
  source: estimate
  image:
    cny_per_unit: null
