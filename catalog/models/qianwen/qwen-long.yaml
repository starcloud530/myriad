# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: qwen-long
vendor: qianwen
name: 通义千问 Long
# 上游调用名，原样传给适配器
vendor_model: qwen-long

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: chat
modality: text
mode: sync
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: chat
enabled: true

io:
  input: [text]
  output: [text]
abilities:
  playground: true

description: |
  通义千问 Long，面向超长上下文的文本型号，官方上下文 1000 万 tokens，适合长文档分析、摘要与抽取。

docs: https://help.aliyun.com/zh/model-studio/qwen-long

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: qwen
  origin_model: qwen-long

specs:
  context_length: 10000000

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
# 中国内地（华北2）实时推理；官方未单列缓存命中价。
pricing:
  unit: token # token | image | audio_second | video_second | request
  currency: CNY
  as_of: 2026-09-16
  source: official # official | estimate
  prompt:
    cny_per_million: 0.5
  completion:
    cny_per_million: 2
  cache_read:
    cny_per_million: null
