# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: seedance
vendor: volcengine
name: Seedance
# seed 接线占位名，不是方舟控制台里的真实接入点 / 预置型号
vendor_model: doubao-seedance

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: generate.video
modality: video
mode: async
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: video.generate
enabled: true

description: |
  火山方舟 Seedance 生视频渠道占位。vendor_model 目前是 doubao-seedance，仅作 seed 接线名，
  不能当官方预置型号直接调用。具体接入点 ID（ep-…）或以控制台开通的官方型号名为准，
  以方舟控制台当前列表为准。异步任务：POST /api/v3/contents/generations/tasks。

docs: https://www.volcengine.com/docs/82379/1520757

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: doubao
  origin_model: seedance

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
pricing:
  unit: video_second
  currency: CNY
  as_of: 2026-09-16
  source: official
  second:
    cny_per_unit: null
