# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: seedance
vendor: volcengine
name: Seedance
# 渠道默认接到当前官方 2.5 预置型号；广场拆卡仍看 doubao-seedance-2-5
vendor_model: doubao-seedance-2-5-260628

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: generate.video
modality: video
mode: async
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: video.generate
enabled: false

description: |
  已下架占位卡。官方没有 doubao-seedance 这个预置 ID。
  广场请用 doubao-seedance-2-5 / doubao-seedance-2-0。网关主路已改 2.5。

docs: https://www.volcengine.com/docs/82379/1520757

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: doubao
  origin_model: seedance

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
pricing:
  unit: video_second
  currency: CNY
  as_of: 2026-09-16
  source: official
  second:
    cny_per_unit: null
