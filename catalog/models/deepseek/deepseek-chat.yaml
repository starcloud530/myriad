# 路径即主键：vendor + id。禁止写 API Key / secret_env。

id: deepseek-chat
vendor: deepseek
name: DeepSeek Chat
# 上游调用名，原样传给适配器
vendor_model: deepseek-chat

# 七族之一：chat | complete | generate.image | generate.video | generate.audio
#          | transduce | score.classify | score.regress | score.embed | extract | realtime
kind: chat
modality: text
mode: sync
# 挂到哪条北向能力；广场可以按型号拆卡，调用仍打这个 capability
capability: chat
enabled: true

description: |
  DeepSeek 通用文本对话，已开通的官方 API 型号 deepseek-chat。

docs: https://api-docs.deepseek.com

# 同一物理型号被另一家服务商上架时，两份文件用同一 lineage 以后再合并
lineage:
  origin: deepseek
  origin_model: deepseek-chat

# 对外标价快照，不是进货账、不是密钥。数字先空着就写 null，不要删掉整段。
# 当前官方价目页 /models 示例已不单列此 id，人民币价查不到。
pricing:
  unit: token # token | image | audio_second | video_second | request
  currency: CNY
  as_of: 2026-09-16
  source: official # official | estimate
  prompt:
    cny_per_million: null
  completion:
    cny_per_million: null
  cache_read:
    cny_per_million: null
